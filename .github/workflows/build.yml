name: Mango iOS Build

on:
  push:
    branches: [ master, mango/ios ]
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Diagnostics
        run: |
          sw_vers
          xcode-select -p
          xcodebuild -version
          python3 --version

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          cp -R "$GITHUB_WORKSPACE" /Users/Shared/
          mv "/Users/Shared/$(basename "$GITHUB_WORKSPACE")" /Users/Shared/telegram-ios

      - name: Generate Mango configuration
        working-directory: /Users/Shared/telegram-ios
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          python3 - build-system/appstore-configuration.json <<'PY'
          import json, os, sys
          cfg = json.load(open(sys.argv[1]))
          cfg["api_id"] = os.environ["API_ID"]
          cfg["api_hash"] = os.environ["API_HASH"]
          # NOTE: bundle_id / team_id are intentionally left as-is for the first
          # pipeline proof, because build-system/fake-codesigning/*.mobileprovision
          # are bound to those values. Swapping them to app.mango.im.ios requires
          # regenerating matching fake provisioning profiles (next milestone).
          with open("build-system/mango-configuration.json", "w") as f:
              json.dump(cfg, f, indent=2)
          print("wrote build-system/mango-configuration.json")
          PY

      - name: Regenerate fake provisioning profiles
        working-directory: /Users/Shared/telegram-ios
        run: |
          python3 build-system/regenerate_fake_profiles.py

      - name: Build the App (unsigned)
        working-directory: /Users/Shared/telegram-ios
        run: |
          set -x

          SOURCE_DIR=/Users/Shared/telegram-ios
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          cd "$SOURCE_DIR"

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"

          APP_VERSION="$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["app"]);')"
          COMMIT_COUNT="$(git rev-list --count HEAD)"
          BUILD_NUMBER="$((COMMIT_COUNT + BUILD_NUMBER_OFFSET))"

          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="build-system/mango-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"
          for f in bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/Telegram.ipa; do
            cp "$f" "$OUTPUT_PATH/"
          done
          ls -la "$OUTPUT_PATH"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Mango-unsigned-ipa
          path: /Users/Shared/telegram-ios/build/artifacts/Telegram.ipa
          if-no-files-found: error
